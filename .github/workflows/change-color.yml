name: Rotate Typing SVG Color

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  rotate-color:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Pick Random Color
        id: picker
        run: |
          # A list of vibrant purple, pink, and magenta hex codes
          COLORS=("8A2BE2" "D14DFF" "FF1493" "FF69B4" "7928CA" "DA70D6" "C71585")
          RANDOM_COLOR=${COLORS[$RANDOM % ${#COLORS[@]}]}
          echo "SELECTED_COLOR=$RANDOM_COLOR" >> $GITHUB_ENV

      - name: Update README
        run: |
          # Dynamically swap out the color code in your README
          sed -i -E 's/color=[0-9A-Fa-f]{6}/color=${{ env.SELECTED_COLOR }}/g' README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "chore: rotate typing color to #${{ env.SELECTED_COLOR }}"
          git push
